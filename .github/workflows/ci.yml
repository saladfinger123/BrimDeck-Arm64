name: Checks
# Pull requests into dev, main or a release branch build and test on Windows x64 and Windows ARM64.
# Release publishing stays in release.yml. This workflow only uploads build artifacts.
on:
  pull_request:
    branches: [dev, main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64
            runtime: win-x64
            expect: x64
            machine: '8664'
            other_payload: arm64
            other_name: reject-win-arm64
          - runner: windows-11-arm
            platform: ARM64
            runtime: win-arm64
            expect: arm64
            machine: aa64
            other_payload: x64
            other_name: reject-win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes files
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        run: |
          $changed = @(git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD" -- releases/)
          if ($LASTEXITCODE -ne 0) { throw 'The changes could not be compared with the target branch.' }
          # Fork channel notes (1.4.0-arm64.1.md) set the version this repository publishes.
          # Any other file under releases/ stays limited to the repository owner.
          $blocked = @($changed | Where-Object { $_ -notmatch '^releases/\d+\.\d+\.\d+-arm64\.\d+\.md$' })
          if ($blocked.Count -gt 0) { throw "Files under releases/ are changed by the maintainer only. Remove these changes: $($blocked -join ', ')" }
      - name: Settings migration labels
        if: github.event_name == 'pull_request'
        run: ./scripts/Test-MigrationVersions.ps1 -TargetBranch $env:GITHUB_BASE_REF
      - name: Installer identity
        run: ./scripts/Test-InstallerIdentity.ps1
      - name: PE audit self-test
        run: python scripts/audit_publish.py --self-test
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        id: build
        run: |
          if ('${{ matrix.platform }}' -eq 'ARM64') {
            dotnet build src/BrimDeck.Core/BrimDeck.Core.csproj -c Release
            dotnet build src/BrimDeck/BrimDeck.csproj -c Release -p:Platform=ARM64
            dotnet build src/BrimDeck.Sensors/BrimDeck.Sensors.csproj -c Release -p:Platform=ARM64
            dotnet build tests/BrimDeck.Tests/BrimDeck.Tests.csproj -c Release
            dotnet build tests/BrimDeck.MediaTests/BrimDeck.MediaTests.csproj -c Release
            dotnet build tests/BrimDeck.WindowsTests/BrimDeck.WindowsTests.csproj -c Release -p:Platform=ARM64
          } else {
            dotnet build BrimDeck.sln -c Release
          }
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Core tests
        run: |
          dotnet run --project tests/BrimDeck.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Media tests
        run: |
          dotnet run --project tests/BrimDeck.MediaTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Media tests failed.' }
      - name: Windows tests (hosted subset)
        run: |
          if ('${{ matrix.platform }}' -eq 'ARM64') {
            dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build -p:Platform=ARM64 -- --hosted
          } else {
            dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build -- --hosted
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
      - name: Publish, package and audit
        run: |
          ./scripts/Publish-Release.ps1 -Version 1.4.0-arm64.1 -Runtime ${{ matrix.runtime }} -OutputDirectory artifacts/${{ matrix.runtime }}
          $publish = (Get-Content -LiteralPath artifacts/${{ matrix.runtime }}/publish-path.txt).Trim()
          python scripts/audit_publish.py --dir $publish --expect ${{ matrix.expect }} --source . --out artifacts/${{ matrix.runtime }}/payload-audit.json --role payload
          if ($LASTEXITCODE -ne 0) { throw 'Payload audit failed.' }
          $setup = Get-ChildItem artifacts/${{ matrix.runtime }} -Filter '*-Setup.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path artifacts/stub | Out-Null
          Copy-Item -LiteralPath $setup.FullName -Destination artifacts/stub/
          python scripts/audit_publish.py --dir artifacts/stub --expect x64 --source . --out artifacts/${{ matrix.runtime }}/installer-stub-audit.json --role installer-stub
          ./scripts/Test-SafeInstall.ps1 -Setup $setup.FullName -ExpectedMachine ${{ matrix.machine }} -ModuleReport artifacts/${{ matrix.runtime }}/loaded-modules.json
          ./scripts/Test-AppUpdate.ps1 -Runtime ${{ matrix.runtime }}
          ./scripts/Test-PortableUpdate.ps1 -Runtime ${{ matrix.runtime }}
          $iscc = & ./scripts/Get-InnoSetup.ps1
          & $iscc -qp -dAppVersion=1.4.0-arm64.1 "-dSourceDir=$publish" -oartifacts/reject "-dPayloadArchitecture=${{ matrix.other_payload }}" "-dOutputName=${{ matrix.other_name }}" installer/BrimDeck.iss
          if ($LASTEXITCODE -ne 0) { throw 'Opposite-architecture installer compilation failed.' }
          ./scripts/Test-SafeInstall.ps1 -Setup "artifacts/reject/${{ matrix.other_name }}.exe" -ExpectedMachine ${{ matrix.machine }} -ExpectRefuse
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: brimdeck-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}/
          if-no-files-found: error
